# Host nginx server block for hs.sclink.dev (Headscale + Web UI).
# TLS terminates here; headscale/webbackend only bind 127.0.0.1.
#
# Drop this into /etc/nginx/sites-available/headscale.conf, symlink to
# /etc/nginx/sites-enabled/, then:
#   1) `nginx -t && nginx -s reload` (with only the :80 block active)
#   2) `certbot certonly --webroot -w /var/www/html -d hs.sclink.dev`
#   3) Uncomment / enable the :443 server block below (cert paths are filled
#      by certbot) and reload again.
# The SSL options are inlined so no certbot-managed options-ssl-nginx.conf is
# required (we used `certonly`, not the nginx installer).

# ---- HTTP :80 : ACME challenge + redirect to HTTPS -------------------------
server {
    listen 80;
    listen [::]:80;
    server_name hs.sclink.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS :443 -----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hs.sclink.dev;

    ssl_certificate     /etc/letsencrypt/live/hs.sclink.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hs.sclink.dev/privkey.pem;
    ssl_session_cache   shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    # Bare root -> the SPA entry point (/ui/). Headscale only redirects /ui,
    # so we handle "/" here so visitors land straight on the login page.
    location = / {
        return 302 /ui/;
    }

    # Web backend: auth + Headscale proxy (holds the API key).
    location /ui/api/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Headscale: SPA (/ui) + its API (/api) + device handshake.
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
